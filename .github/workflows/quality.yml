name: Quality

on:
  pull_request:

# Cancel any in-progress run on the same PR when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trend_radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trend_radar_test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Set up database
        run: bin/rails db:schema:load

      - name: Build vite assets for tests
        run: bin/vite build

      - name: Run full quality gate (includes mutation testing)
        run: bin/rake quality

      - name: Upload quality artifacts (mutation.txt etc.) for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts
          path: tmp/quality/
          retention-days: 14
